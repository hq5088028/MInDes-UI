[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mindes-ui"
version = "0.1.0"
description = "MInDes UI and plotting tools"
requires-python = ">=3.12"
dependencies = [
    "contourpy==1.3.3",
    "cycler==0.12.1",
    "fonttools==4.61.1",
    "kiwisolver==1.4.9",
    "matplotlib==3.10.8",
    "numpy==2.4.0",
    "openpyxl>=3.1.5",
    "packaging==25.0",
    "pandas==2.3.3",
    "pillow==12.0.0",
    "pyparsing==3.3.1",
    "pyside6==6.10.1",
    "pyside6-addons==6.10.1",
    "pyside6-essentials==6.10.1",
    "python-dateutil==2.9.0.post0",
    "pytz==2025.2",
    "shiboken6==6.10.1",
    "six==1.17.0",
    "tzdata==2025.3",
    "vtk==9.5.2",
]

[project.scripts]
mindes-ui = "mindes_ui.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]